# This file is responsible for configuring nginx on hetzner.
# This is a template - some of the PUBLISH_STAGE_ strings are replaced before starting nginx.
# References:
# * https://github.com/IAmATeaPot418/nginx-hardening/blob/master/nginx.conf

log_format honeypot_hit '$remote_addr';

# Deny all traffic that doesn't exactly meet the requirements in other server configurations.
server {
  return 404;
}

server {
  listen 80;
  server_name PUBLISH_STAGE_IP_ADDRESS PUBLISH_STAGE_DNS_NAME;

  # Redirect all HTTP to HTTPS.
  return 301 https://$host$request_uri;
}

server {
  include mime.types;

  gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types
      text/plain
      text/css
      application/json
      application/x-javascript
      application/javascript
      text/xml
      application/xml
      application/rss+xml
      text/javascript image/svg+xml
      application/vnd.ms-fontobject
      application/x-font-ttf
      font/opentype;

  listen 443 ssl http2;
  server_name PUBLISH_STAGE_IP_ADDRESS PUBLISH_STAGE_DNS_NAME;

  root /var/www/html;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/PUBLISH_STAGE_CERT/cert.pem;
  ssl_certificate_key /etc/letsencrypt/live/PUBLISH_STAGE_CERT/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';
  ssl_prefer_server_ciphers on;
  ssl_trusted_certificate /etc/letsencrypt/live/PUBLISH_STAGE_CERT/chain.pem;
  ssl_session_tickets off;

  # Information disclosure mitigation.
  server_tokens off;

  # DoS mitigation.
  keepalive_timeout 10;
  send_timeout 10;
  client_body_timeout 10;
  #client_max_body_size 100K; This didn't work for serving some large files.
  client_header_timeout 10;
  large_client_header_buffers 2 1k;

  # FIXME You may actually need to increase for larger files, but TBD.
  client_body_buffer_size 128k;
  client_max_body_size 10m;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;

  # Configure security headers.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Xss-Protection "1; mode=block" always;
  add_header Content-Security-Policy "base-uri 'self' PUBLISH_STAGE_DNS_NAME;";
  # FIXME nginx says valid but error is NS_ERROR_ILLEGAL_VALUE
  # add_header Content-Security-Policy "base-uri 'self' PUBLISH_STAGE_DNS_NAME;
  #                                     default-src 'none';
  #                                     script-src 'self' PUBLISH_STAGE_DNS_NAME 'unsafe-eval' 'unsafe-inline' https:;
  #                                     style-src 'self' PUBLISH_STAGE_DNS_NAME 'unsafe-inline' https:;
  #                                     img-src 'self' PUBLISH_STAGE_DNS_NAME data: blob:;
  #                                     font-src 'self' PUBLISH_STAGE_DNS_NAME data:;
  #                                     connect-src 'self' PUBLISH_STAGE_DNS_NAME blob: ws:;
  #                                     worker-src 'self' PUBLISH_STAGE_DNS_NAME blob:;
  #                                     form-action 'self' PUBLISH_STAGE_DNS_NAME;
  #                                     object-src 'self' data: blob:;
  #                                     frame-ancestors 'self' blob:;
  #                                     frame-src https:;
  #                                     media-src https:;
  #                                     upgrade-insecure-requests;
  #                                     block-all-mixed-content;
  #                                     manifest-src 'self' PUBLISH_STAGE_DNS_NAME;";
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=15768000;" always;

  # Limit to an IP - in dev, your public IP, in prod, 0.0.0.0.
  # Disallowed IPs get redirected to John Connor. See: https://github.com/mainframenzo/john-connor
  allow RESTRICT_TO_PUBLIC_IP;
  deny all;

  # Here's what we're dealing with:
  # * This blog is regularly poked at by idiots, kids, and nation states.
  #   They look for common secret files in places like `/admin/.env`. To do what with, bro?
  #   Crypto mine? (Yea, probably) They'll find those files here, alright :D
  # * This blog is bombarded with requests from "users" with empty user-agents (probably not folks using netcat, lol).
  #   They'll find an HTTP response fit for such ghoulish behavior, alright.
  #
  # Here's how we're dealing with them:
  # Redirect all errors to a Github Pages domain you setup.
  # That domain returns HTML which endlessly redirects to itself, free of charge ("thanks" Microsoft!).
  #
  # Still getting "charged" for the bytes out, though. Sigh.
  #
  # XO and Snootchie Bootchies.
  if ($http_user_agent = "") {
    return 301 https://mainframenzo.github.io/john-connor/;
  }

  if ($http_user_agent = "__EMPTY__") {
    return 301 https://mainframenzo.github.io/john-connor/;
  }

  # Restrict hidden files. Don't think you have any, but JIC.
  location ~ /\.{
    deny all;

    return 301 https://mainframenzo.github.io/john-connor/;
  }

  # FIXME Can remove? Fixed with another config.
  # Otherwise browser error is: downloadable font: rejected by sanitizer .
  # location ~* \.(eot|otf|ttf|woff|woff2)$ {
  #   add_header Access-Control-Allow-Origin *;
  # }

  # Otherwise "blocked"?
  location ~ \.(wav|ogg|mp4|webm)$ {
    max_ranges 0;
  }

  # Empty user agents get redirected to John Connor so they're never banned,
  #  but the situation is handled.
  location = /honeypot.html {
    access_log /var/log/nginx/honeypot.log honeypot_hit;
    try_files $uri =404;
  }

  # Tries to serve the requested URI as a file, then a directory (looking for an index file), or returns 404.
  location / {
    try_files $uri $uri/ =404;
  }

  # FIXME During development not all resources available?
  # location @vite {
  #   proxy_pass http://127.0.0.1:8080;

  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;

  #   proxy_set_header Upgrade $http_upgrade;
  #   proxy_set_header Connection "upgrade";
  # }

  # Redirect client error pages (not found is considered adverserial, basically).
  error_page 400 401 402 403 404 405 418 /404.html;
  location = /404.html {
    return 301 https://mainframenzo.github.io/john-connor/;
  }

  # Redirect server error pages (your errors need to be considered adverserial, sucks).
  error_page 500 502 503 504 /error.html;
  location = /error.html {
    return 301 https://mainframenzo.github.io/john-connor/;
  }

  location /api {
    proxy_pass http://localhost:8081;
  }
}
