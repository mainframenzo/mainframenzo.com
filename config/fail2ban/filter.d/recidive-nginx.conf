[Definition]
# Matches a ban notice from ANY jail (ssh, ssh-ddos, nginx-abuse-protect,
#  nginx-ddos-protect, nginx-auth-login, etc.), not just nginx-abuse-protect.
# This lets repeat offenders of *any* jail escalate to the longer recidive
#  ban, instead of only repeat php-scanner bots.
failregex = ^.*fail2ban\.actions.*NOTICE.*\[.*\]\s*Ban\s+<HOST>\s*$
ignoreregex =
