type: object
required: [pid, user, rss, vsz, cmd]
properties:
  pid:
    type: integer
    example: 1234
  user:
    type: string
    example: root
  cpu%:
    type: number
    description: CPU usage percentage
    example: 12.5
  mem%:
    type: number
    description: Memory usage percentage
    example: 3.2
  rss:
    type: integer
    description: Resident set size in KB
    example: 204800
  vsz:
    type: integer
    description: Virtual memory size in KB
    example: 512000
  cmd:
    type: string
    example: node