                        - type: string
                      example: 1296068472
                    updated_at:
                      type: string
                      example: 2011-01-26T19:14:43Z
                    pushed_at:
                      oneOf:
                        - type: integer
                          description: Unix timestamp (used in webhook push payloads).
                        - type: string
                        - type: "null"
