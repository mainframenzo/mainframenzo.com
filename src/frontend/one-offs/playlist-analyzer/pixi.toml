[workspace]
name = "playlist-analyzer"
version = "0.1.0"
description = "Playlist Analyzer"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pip = "25.*"
ffmpeg = "==8.1.2"

[pypi-dependencies]
all-in-one-infer = "==3.1.0"
torchcodec = "==0.15.0"
matplotlib = ">=3.5"
pillow = "==12.3.0"
essentia = "==2.1b6.dev1389"
numpy = ">=1.24"

[environments]
default = { solve-group = "default" }
